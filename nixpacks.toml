# nixpacks.toml — Nixpacks build config for Railway deployment
# Monorepo: prisma/ at root, rozedesk-app/ is the Next.js app.
#
# KEY RULE: install phase MUST use `cd rozedesk-app && npm ci`, NOT
# `npm ci --prefix rozedesk-app`. The --prefix flag installs into
# rozedesk-app/node_modules but leaves CWD at /app (root), so
# `prisma generate` cannot resolve @prisma/client via Node module
# resolution from the schema's output path. Using a real `cd` keeps
# the working directory consistent across install → build phases.
#
# openssl is required by Prisma's query-engine binary — always include it.

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["cd rozedesk-app && npm ci --ignore-engines"]

[phases.build]
cmds = [
  "cd rozedesk-app && ./node_modules/.bin/prisma generate --schema=../prisma/schema.prisma",
  "cd rozedesk-app && ./node_modules/.bin/next build",
]

[start]
cmd = "cd rozedesk-app && node_modules/.bin/prisma db push --schema=../prisma/schema.prisma --skip-generate --accept-data-loss && node_modules/.bin/next start -p ${PORT:-3000}"
