# nixpacks.toml — Nixpacks build config for Railway deployment
# Monorepo: schema now lives at rozedesk-app/prisma/schema.prisma
# so @prisma/client resolves from rozedesk-app/node_modules — no cross-directory issue.
#
# openssl is required by Prisma's query-engine binary.

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["cd rozedesk-app && npm ci --ignore-engines"]

[phases.build]
cmds = [
  "cd rozedesk-app && ./node_modules/.bin/prisma generate --schema=./prisma/schema.prisma",
  "cd rozedesk-app && ./node_modules/.bin/next build",
]

[start]
cmd = "cd rozedesk-app && node_modules/.bin/prisma db push --schema=./prisma/schema.prisma --config=./prisma7.config.ts --url=mysql://root:${MYSQLPASSWORD}@${MYSQLHOST}:3306/${MYSQLDATABASE} --accept-data-loss && node_modules/.bin/next start -p ${PORT:-3000}"
