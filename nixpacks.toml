# nixpacks.toml — Nixpacks build config for Railway
# Monorepo: prisma/ at root, Next.js app in rozedesk-app/

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["cd rozedesk-app && npm ci --frozen-lockfile"]

[phases.build]
cmds = [
  "cd rozedesk-app && ./node_modules/.bin/prisma generate --schema=../prisma/schema.prisma",
  "cd rozedesk-app && ./node_modules/.bin/next build"
]

[start]
cmd = "cd rozedesk-app && node .next/standalone/server.js"
