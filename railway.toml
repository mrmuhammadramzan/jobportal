# railway.toml — Railway deployment config for RozeDesk
# Monorepo layout:
#   /prisma/          — Prisma schema + config (outside app)
#   /rozedesk-app/    — Next.js app

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd rozedesk-app && node .next/standalone/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
