# railway.toml — Railway deployment config for RozeDesk
# Monorepo: /prisma/ at root, /rozedesk-app/ is the Next.js app.

[build]
builder = "nixpacks"
buildCommand = "cd rozedesk-app && npm install --ignore-engines && ./node_modules/.bin/prisma generate --schema=../prisma/schema.prisma && ./node_modules/.bin/prisma db push --schema=../prisma/schema.prisma && ./node_modules/.bin/next build"

[deploy]
# Use next start directly — no standalone mode needed for Railway's persistent Node runtime.
startCommand = "cd rozedesk-app && node_modules/.bin/next start -p ${PORT:-3000}"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
