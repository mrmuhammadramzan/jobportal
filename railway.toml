# railway.toml — Railway deployment config for RozeDesk
# Monorepo: /prisma/ at root, /rozedesk-app/ is the Next.js app.
#
# NIXPACKS_NODE_VERSION must also be set in Railway Variables UI
# to guarantee the correct Node version regardless of Nixpacks snapshot.

[build]
builder = "nixpacks"
# List standalone contents after build so we can see the exact server.js path in build logs
buildCommand = "cd rozedesk-app && npm install --ignore-engines && ./node_modules/.bin/prisma generate --schema=../prisma/schema.prisma && ./node_modules/.bin/next build && find rozedesk-app/.next/standalone -name 'server.js' 2>/dev/null || find .next/standalone -name 'server.js' 2>/dev/null"

[deploy]
startCommand = "node rozedesk-app/.next/standalone/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
