# railway.toml — Railway deployment config for RozeDesk
# Monorepo: /prisma/ at root, /rozedesk-app/ is the Next.js app.
#
# Build phases are declared in nixpacks.toml (same directory).
# railway.toml only sets deployment behaviour.

[build]
builder = "nixpacks"
# buildCommand intentionally omitted — nixpacks.toml [phases.build] owns this.
# Setting buildCommand here would override nixpacks.toml and skip prisma generate.

[deploy]
# startCommand overrides nixpacks.toml [start] at deploy time.
# Two-phase start:
#   1. prisma db push  — syncs schema to Railway DB at runtime when real
#      credentials are available. --skip-generate: client was built already.
#      --accept-data-loss: safe for additive schema changes; remove once you
#      switch to prisma migrate for production.
#   2. next start      — serves the app.
startCommand = "cd rozedesk-app && node_modules/.bin/prisma db push --schema=./prisma/schema.prisma --url=${MYSQL_URL} --accept-data-loss && node_modules/.bin/next start -p ${PORT:-3000}"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
