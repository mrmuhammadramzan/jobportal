# railway.toml — Railway deployment config for RozeDesk
# Monorepo: /prisma/ at root, /rozedesk-app/ is the Next.js app.
#
# NIXPACKS_NODE_VERSION must also be set in Railway Variables UI
# to guarantee the correct Node version regardless of Nixpacks snapshot.

[build]
builder = "nixpacks"
buildCommand = "cd rozedesk-app && npm install && ./node_modules/.bin/prisma generate --schema=../prisma/schema.prisma && ./node_modules/.bin/next build"

[deploy]
startCommand = "cd rozedesk-app && node .next/standalone/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
