# railway.toml — Railway deployment config for RozeDesk
# Monorepo layout:
#   /prisma/          — Prisma schema + config (outside app)
#   /rozedesk-app/    — Next.js app

[build]
builder = "nixpacks"
buildCommand = "cd rozedesk-app && npm ci --frozen-lockfile && node node_modules/prisma/build/index.js generate --schema=../prisma/schema.prisma && node node_modules/next/dist/bin/next build"

[deploy]
startCommand = "cd rozedesk-app && node .next/standalone/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
